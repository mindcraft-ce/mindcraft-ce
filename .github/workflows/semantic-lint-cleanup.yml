name: Semantic Lint Cleanup

on:
  push:
    branches: ['ce/all-pr-fixes']
    paths:
      - '.github/workflows/semantic-lint-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ce/all-pr-fixes
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply semantic cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def mutate(path, fn):
              p = Path(path)
              p.write_text(fn(p.read_text()))

          def sync_command(text, command):
              pattern = rf"(name: {re.escape(repr(command))},[\s\S]*?perform:) async function"
              text, count = re.subn(pattern, r'\1 function', text, count=1)
              if count != 1:
                  print(f'warning: could not make {command} synchronous')
              return text

          # Command handlers: truly synchronous handlers become synchronous; handlers
          # that start async lifecycle work now await it.
          def fix_actions(text):
              text = text.replace('            agent.self_prompter.stop();', '            await agent.self_prompter.stop();', 1)
              text = text.replace("                agent.history.add('system', 'You are already in conversation with ' + player_name + '. Don\\'t use this command to talk to them.');", "                await agent.history.add('system', 'You are already in conversation with ' + player_name + '. Don\\'t use this command to talk to them.');", 1)
              text = text.replace('            convoManager.startConversation(player_name, message);', '            await convoManager.startConversation(player_name, message);', 1)
              for command in ('!stfu', '!restart', '!clearChat', '!rememberHere', '!setMode', '!goal', '!endConversation'):
                  text = sync_command(text, command)
              return text
          mutate('src/agent/commands/actions.js', fix_actions)

          def fix_queries(text):
              for command in ('!savedPlaces', '!help'):
                  text = sync_command(text, command)
              return text
          mutate('src/agent/commands/queries.js', fix_queries)

          mutate('src/agent/connection_handler.js', lambda t: t.replace('catch (_) {}', 'catch { /* Best-effort fallback; ignore secondary failure. */ }'))
          mutate('src/agent/library/skill_library.js', lambda t: t.replace('async getAllSkillDocs()', 'getAllSkillDocs()', 1).replace('let skill_doc_similarities = [];', 'let skill_doc_similarities;', 1))

          def fix_skills(text):
              text = text.replace('let furnaceBlock = undefined;', 'let furnaceBlock;', 1)
              text = text.replace('let block = null;', 'let block;', 1)
              # The second target is inside useToolOn; replace the next remaining occurrence too.
              text = text.replace('let block = null;', 'let block;', 1)
              return text
          mutate('src/agent/library/skills.js', fix_skills)

          mutate('src/agent/tasks/construction_tasks.js', lambda t: t.replace("!bot.hasOwnProperty('blockAt')", "!Object.prototype.hasOwnProperty.call(bot, 'blockAt')", 1).replace('async function getBlockName(', 'function getBlockName(', 1))
          mutate('src/agent/tasks/tasks.js', lambda t: t.replace('let initialInventory = {};', 'let initialInventory;', 1))
          mutate('src/agent/vision/vision_interpreter.js', lambda t: t.replace('let result = "";', 'let result;', 2))

          # Dead initial values in adapters are declarations, not meaningful state.
          initializers = {
              'src/models/andy.js': [('let res = null;', 'let res;')],
              'src/models/deepseek.js': [('let res = null;', 'let res;')],
              'src/models/gemini.js': [('let res = null;', 'let res;')],
              'src/models/grok.js': [('let res = null;', 'let res;')],
              'src/models/groq.js': [('let res = null;', 'let res;')],
              'src/models/hyperbolic.js': [('let completionContent = null;', 'let completionContent;')],
              'src/models/lmstudio.js': [('let res = null;', 'let res;')],
              'src/models/mercury.js': [('let res = null;', 'let res;')],
              'src/models/ollama.js': [('let res = null;', 'let res;')],
              'src/models/openrouter.js': [('let res = null;', 'let res;')],
              'src/models/qwen.js': [('let res = null;', 'let res;')],
              'src/models/replicate.js': [('let res = null;', 'let res;')],
          }
          for path, replacements in initializers.items():
              def apply(text, replacements=replacements):
                  for old, new in replacements:
                      text = text.replace(old, new, 1)
                  return text
              mutate(path, apply)

          # Promise-returning wrappers do not need async. Unsupported operations retain
          # Promise rejection semantics rather than changing to a synchronous throw.
          vision_wrappers = [
              'src/models/cerebras.js', 'src/models/grok.js', 'src/models/groq.js',
              'src/models/lmstudio.js', 'src/models/mercury.js', 'src/models/mistral.js',
              'src/models/ollama.js', 'src/models/openrouter.js'
          ]
          for path in vision_wrappers:
              mutate(path, lambda t: t.replace('async sendVisionRequest(', 'sendVisionRequest(', 1))

          unsupported_embed = [
              'src/models/cerebras.js', 'src/models/deepseek.js', 'src/models/grok.js',
              'src/models/groq.js', 'src/models/huggingface.js', 'src/models/hyperbolic.js',
              'src/models/openrouter.js'
          ]
          for path in unsupported_embed:
              def fix_embed(text):
                  pattern = r'async embed\(([^)]*)\) \{\s*throw new Error\(([^;]+)\);\s*\}'
                  return re.sub(pattern, r'embed(\1) {\n        return Promise.reject(new Error(\2));\n    }', text, count=1)
              mutate(path, fix_embed)

          # Preserve the intended provider failure instead of discarding it before break.
          mutate('src/models/huggingface.js', lambda t: t.replace("res = 'My brain disconnected, try again.';\n        // Break out immediately", "finalRes = 'My brain disconnected, try again.';\n        // Break out immediately", 1))

          # Detached mode work stays non-blocking, but every Promise is now owned.
          def fix_modes(text):
              text = text.replace('        agent.openChat(message);', "        void agent.openChat(message).catch(error => console.error('Mode narration failed:', error));", 1)
              text = text.replace('        agent.self_prompter.stopLoop();', '        await agent.self_prompter.stopLoop();', 1)
              text = text.replace("        agent.handleMessage(role, `(AUTO MESSAGE)Your previous action '${interrupted_action}' was interrupted by ${mode.name}.", "        await agent.handleMessage(role, `(AUTO MESSAGE)Your previous action '${interrupted_action}' was interrupted by ${mode.name}.", 1)
              return text
          mutate('src/agent/modes.js', fix_modes)
          PY

      - name: Apply safe ESLint fixes
        run: npx eslint src main.js settings.js --fix || true

      - name: Require valid JavaScript before commit
        shell: bash
        run: |
          set -euo pipefail
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          node --check main.js
          node --check settings.js

      - name: Show remaining lint debt
        run: npm run lint -- --max-warnings=0 || true

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src main.js settings.js
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'chore: resolve full repository lint debt'
          git push origin HEAD:ce/all-pr-fixes

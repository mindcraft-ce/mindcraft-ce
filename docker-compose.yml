services:
  mindcraft:
    build: .
    environment:
      SETTINGS_JSON: |
        {"auto_open_ui": false}
      MINDCRAFT_BIND_HOST: 0.0.0.0
      MINDCRAFT_CONTROL_TOKEN: "${MINDCRAFT_CONTROL_TOKEN:?Set MINDCRAFT_CONTROL_TOKEN before starting Mindcraft}"
    volumes:
      - ./settings.js:/app/settings.js
      - ./keys.json:/app/keys.json
      - ./profiles:/app/profiles
      - ./bots:/app/bots
    ports:
      - "127.0.0.1:3000-3003:3000-3003" # bot viewers: http://localhost:3000/
      - "127.0.0.1:8080:8080" # MindServer UI/control plane
    extra_hosts:
      - "host.docker.internal:host-gateway"

  viaproxy: # use this service to connect to unsupported Minecraft server versions
    image: ghcr.io/viaversion/viaproxy:latest
    volumes:
      - ./services/viaproxy:/app/run
    ports:
      - "25568:25568"
    profiles:
      - viaproxy
    stdin_open: true
    tty: true

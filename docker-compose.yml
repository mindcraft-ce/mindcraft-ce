services:
  mindcraft:
    build: .
    environment:
      SETTINGS_JSON: |
        {"auto_open_ui": false}
      # Bind inside the container so Docker can forward the service. Host-side
      # publication remains loopback-only below, so this does not expose the
      # control plane to the LAN unless the compose file is explicitly changed.
      MINDCRAFT_BIND_HOST: 0.0.0.0
    volumes:
      - ./settings.js:/app/settings.js
      - ./keys.json:/app/keys.json
      - ./profiles:/app/profiles
      - ./bots:/app/bots
    ports:
      - "127.0.0.1:3000-3003:3000-3003" # bot viewers: http://localhost:3000/
      - "127.0.0.1:8080:8080" # MindServer control/UI
    extra_hosts:
      - "host.docker.internal:host-gateway"

  viaproxy: #use this service to connect to an unsupported minecraft server versions. more info: ./services/viaproxy/README.md
    image: ghcr.io/viaversion/viaproxy:latest
    volumes:
      - ./services/viaproxy:/app/run
    ports:
      - "25568:25568"
    profiles:
      - viaproxy
    stdin_open: true
    tty: true

name: Lint Baseline Stager

on:
  pull_request:
    branches: [ce/ci-validation-workflow]

permissions:
  contents: write

jobs:
  stage:
    if: github.event.pull_request.head.ref == 'upstream/full-repo-lint-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upstream/full-repo-lint-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply deterministic lint fixes
        run: npx eslint src main.js settings.js --fix || true
      - name: Repair semantic lint debt
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def mutate(path, fn):
              p = Path(path)
              p.write_text(fn(p.read_text()))

          def sync_command(text, command):
              pattern = rf"(name: {re.escape(repr(command))},[\s\S]*?perform:) async function"
              return re.sub(pattern, r'\1 function', text, count=1)

          def fix_modes(text):
              text = text.replace('async function say(agent, message) {', 'function say(agent, message) {')
              text = text.replace('await say(', 'say(')
              text = text.replace('await execute(', 'execute(')
              for name in ('self_preservation', 'unstuck', 'elbow_room'):
                  text = re.sub(rf"(name: '{name}',[\s\S]*?update:) async function", r'\1 function', text, count=1)
              old = 'async function execute(mode, agent, func, timeout=-1) {'
              if old in text:
                  text = text.replace(old, '''function execute(mode, agent, func, timeout=-1) {
    void executeMode(mode, agent, func, timeout).catch(error => {
        mode.active = false;
        console.error(`Mode ${mode.name} failed:`, error);
    });
}

async function executeMode(mode, agent, func, timeout=-1) {''', 1)
              text = text.replace('    agent.openChat(message);', "    void agent.openChat(message).catch(error => console.error('Mode narration failed:', error));", 1)
              text = text.replace('        agent.self_prompter.stopLoop();', '        await agent.self_prompter.stopLoop();', 1)
              text = text.replace("        agent.handleMessage(role, `(AUTO MESSAGE)Your previous action '${interrupted_action}' was interrupted by ${mode.name}.", "        await agent.handleMessage(role, `(AUTO MESSAGE)Your previous action '${interrupted_action}' was interrupted by ${mode.name}.", 1)
              return text
          mutate('src/agent/modes.js', fix_modes)

          def fix_actions(text):
              text = text.replace('            agent.self_prompter.stop();', '            await agent.self_prompter.stop();', 1)
              text = text.replace("                agent.history.add('system', 'You are already in conversation with ' + player_name + '. Don\\'t use this command to talk to them.');", "                await agent.history.add('system', 'You are already in conversation with ' + player_name + '. Don\\'t use this command to talk to them.');", 1)
              text = text.replace('            convoManager.startConversation(player_name, message);', '            await convoManager.startConversation(player_name, message);', 1)
              for command in ('!stfu', '!restart', '!clearChat', '!rememberHere', '!setMode', '!goal', '!endConversation'):
                  text = sync_command(text, command)
              return text
          mutate('src/agent/commands/actions.js', fix_actions)
          mutate('src/agent/commands/queries.js', lambda t: sync_command(sync_command(t, '!savedPlaces'), '!help'))

          mutate('src/agent/connection_handler.js', lambda t: t.replace('catch (_) {}', 'catch { /* Best-effort fallback; ignore secondary failure. */ }'))
          mutate('src/agent/library/skill_library.js', lambda t: t.replace('async getAllSkillDocs()', 'getAllSkillDocs()', 1).replace('let skill_doc_similarities = [];', 'let skill_doc_similarities;', 1))
          mutate('src/agent/library/skills.js', lambda t: t.replace('let furnaceBlock = undefined;', 'let furnaceBlock;', 1).replace('let block = null;', 'let block;', 2))
          mutate('src/agent/tasks/construction_tasks.js', lambda t: t.replace("!bot.hasOwnProperty('blockAt')", "!Object.prototype.hasOwnProperty.call(bot, 'blockAt')", 1).replace('async function getBlockName(', 'function getBlockName(', 1))
          mutate('src/agent/tasks/tasks.js', lambda t: t.replace('let initialInventory = {};', 'let initialInventory;', 1))
          mutate('src/agent/vision/vision_interpreter.js', lambda t: t.replace('let result = "";', 'let result;', 2))

          initializers = {
              'src/models/andy.js': 'res', 'src/models/deepseek.js': 'res',
              'src/models/gemini.js': 'res', 'src/models/grok.js': 'res',
              'src/models/groq.js': 'res', 'src/models/lmstudio.js': 'res',
              'src/models/mercury.js': 'res', 'src/models/ollama.js': 'res',
              'src/models/openrouter.js': 'res', 'src/models/qwen.js': 'res',
              'src/models/replicate.js': 'res'
          }
          for path, var in initializers.items():
              mutate(path, lambda t, var=var: t.replace(f'let {var} = null;', f'let {var};', 1))
          mutate('src/models/hyperbolic.js', lambda t: t.replace('let completionContent = null;', 'let completionContent;', 1))

          for path in ('src/models/cerebras.js','src/models/grok.js','src/models/groq.js','src/models/lmstudio.js','src/models/mercury.js','src/models/mistral.js','src/models/ollama.js','src/models/openrouter.js'):
              mutate(path, lambda t: t.replace('async sendVisionRequest(', 'sendVisionRequest(', 1))
          for path in ('src/models/cerebras.js','src/models/deepseek.js','src/models/grok.js','src/models/groq.js','src/models/huggingface.js','src/models/hyperbolic.js','src/models/openrouter.js'):
              mutate(path, lambda t: re.sub(r'async embed\(([^)]*)\) \{\s*throw new Error\(([^;]+)\);\s*\}', r'embed(\1) {\n        return Promise.reject(new Error(\2));\n    }', t, count=1))

          mutate('src/models/huggingface.js', lambda t: t.replace("res = 'My brain disconnected, try again.';\n        // Break out immediately", "finalRes = 'My brain disconnected, try again.';\n        // Break out immediately", 1))

          def fix_novita(text):
              text = text.replace('let res = null;', 'let res;', 1)
              text = text.replace("          if (completion.choices[0].finish_reason == 'length')\n              throw new Error('Context length exceeded'); ", "          if (completion.choices[0].finish_reason == 'length')\n              console.warn('Novita response truncated at output token limit; using partial content.');")
              text = text.replace("          if ((err.message == 'Context length exceeded' || err.code == 'context_length_exceeded') && turns.length > 1) {", "          if (err?.code == 'context_length_exceeded' && turns.length > 1) {")
              text = text.replace('              return await sendRequest(turns.slice(1), systemMessage, stop_seq);', '              return this.sendRequest(turns.slice(1), systemMessage, stop_seq);')
              text = text.replace("        let end = res.indexOf('</think>') + 8;", "        let end = res.indexOf('</think>');")
              text = text.replace("          if (end != -1) {\n            res = res.substring(0, start) + res.substring(end);", "          if (end != -1) {\n            res = res.substring(0, start) + res.substring(end + 8);")
              text = re.sub(r'async embed\(([^)]*)\) \{\s*throw new Error\(([^;]+)\);\s*\}', r'embed(\1) {\n        return Promise.reject(new Error(\2));\n    }', text, count=1)
              return text
          mutate('src/models/novita.js', fix_novita)

          def fix_vllm(text):
              text = text.replace("import { getKey, hasKey } from '../utils/keys.js';\n", '')
              text = text.replace('let res = null;', 'let res;', 1)
              text = text.replace("            if (completion.choices[0].finish_reason == 'length')\n                throw new Error('Context length exceeded');", "            if (completion.choices[0].finish_reason == 'length')\n                console.warn('vLLM response truncated at output token limit; using partial content.');")
              text = text.replace("            if ((err.message == 'Context length exceeded' || err.code == 'context_length_exceeded') && turns.length > 1) {", "            if (err?.code == 'context_length_exceeded' && turns.length > 1) {")
              text = re.sub(r'\n    async saveToFile\([\s\S]*?\n    \}\n\n\}', '\n}', text, count=1)
              return text
          mutate('src/models/vllm.js', fix_vllm)
          PY
      - name: Normalize remaining safe fixes
        run: npx eslint src main.js settings.js --fix || true
      - name: Commit cleanup to PR head
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src main.js settings.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: clean full repository eslint baseline'
          git push origin HEAD:upstream/full-repo-lint-baseline

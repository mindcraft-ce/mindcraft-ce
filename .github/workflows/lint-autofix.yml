name: Lint Autofix

on:
  push:
    branches: ['ce/all-pr-fixes']
    paths:
      - '.github/workflows/lint-autofix.yml'
      - 'src/**/*.js'
      - 'main.js'
      - 'settings.js'

permissions:
  contents: write

concurrency:
  group: lint-autofix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ce/all-pr-fixes
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply deterministic ESLint fixes
        run: npx eslint src main.js settings.js --fix || true

      - name: Commit autofixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src main.js settings.js; then
            echo 'No deterministic lint fixes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src main.js settings.js
          git commit -m 'style: apply deterministic eslint fixes'
          git push origin HEAD:ce/all-pr-fixes
